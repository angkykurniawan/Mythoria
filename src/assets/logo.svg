<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Filter Bayangan Komik Tajam -->
    <filter id="comic-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Latar Belakang Lingkaran Komik Pop-Art Kuning & Merah -->
  <circle cx="128" cy="128" r="116" fill="#fde047" stroke="#000000" stroke-width="8" filter="url(#comic-shadow)" />
  <circle cx="128" cy="128" r="102" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 8" />

  <!-- Strip Film Seluloid 35mm Melengkung (Elemen Sinema Jadul) -->
  <path d="M 40 160 C 70 80, 180 80, 216 160" fill="none" stroke="#000000" stroke-width="26" stroke-linecap="round" />
  <path d="M 40 160 C 70 80, 180 80, 216 160" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  
  <!-- Lubang Sprocket Film 35mm -->
  <circle cx="56" cy="144" r="3" fill="#000000" />
  <circle cx="76" cy="122" r="3" fill="#000000" />
  <circle cx="100" cy="108" r="3" fill="#000000" />
  <circle cx="128" cy="102" r="3" fill="#000000" />
  <circle cx="156" cy="108" r="3" fill="#000000" />
  <circle cx="180" cy="122" r="3" fill="#000000" />
  <circle cx="200" cy="144" r="3" fill="#000000" />

  <!-- Buku / Grimoire Realitas Kuno (Sampul Tebal Komik) -->
  <g filter="url(#comic-shadow)">
    <!-- Sampul Luar Belakang (Merah Crimson) -->
    <path d="M 48 184 L 128 204 L 208 184 L 208 96 L 128 116 L 48 96 Z" fill="#b91c1c" stroke="#000000" stroke-width="7" stroke-linejoin="round" />

    <!-- Lembaran Kertas Komik Kiri (Putih-Gading) -->
    <path d="M 54 104 C 84 108, 114 116, 126 122 L 126 196 C 104 190, 74 182, 54 178 Z" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
    <!-- Garis Teks Naskah Halaman Kiri -->
    <line x1="68" y1="126" x2="112" y2="134" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <line x1="68" y1="142" x2="112" y2="150" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <line x1="68" y1="158" x2="100" y2="164" stroke="#000000" stroke-width="4" stroke-linecap="round" />

    <!-- Lembaran Kertas Komik Kanan (Putih-Kuningan) -->
    <path d="M 202 104 C 172 108, 142 116, 130 122 L 130 196 C 152 190, 182 182, 202 178 Z" fill="#fef9c3" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
    <!-- Garis Teks Naskah Halaman Kanan -->
    <line x1="144" y1="134" x2="188" y2="126" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <line x1="144" y1="150" x2="188" y2="142" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <line x1="156" y1="164" x2="188" y2="158" stroke="#000000" stroke-width="4" stroke-linecap="round" />

    <!-- Tulang Tengah Buku (Spine) -->
    <line x1="128" y1="116" x2="128" y2="204" stroke="#000000" stroke-width="7" />
  </g>

  <!-- Pena Bulu Ajaib (Pena Emas Pengubah Realitas) -->
  <g transform="rotate(35 150 70)">
    <!-- Bayangan Pena -->
    <path d="M 148 24 C 160 38, 168 65, 142 96 L 140 120 L 136 120 L 138 96 C 122 75, 130 45, 148 24 Z" fill="#f59e0b" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <!-- Mata Pena Logam Emas Tajam -->
    <polygon points="135,118 141,118 138,136" fill="#000000" />
    <!-- Belahan Pena -->
    <line x1="138" y1="118" x2="138" y2="132" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Kilatan Sihir Realitas / Bintang Komik (Sparkles) -->
  <polygon points="186,46 192,58 204,64 192,70 186,82 180,70 168,64 180,58" fill="#fbbf24" stroke="#000000" stroke-width="3" />
  <polygon points="64,68 68,76 76,80 68,84 64,92 60,84 52,80 60,76" fill="#ef4444" stroke="#000000" stroke-width="3" />

  <!-- Huruf Inisial "M" Komik Retro di Bagian Bawah -->
  <g transform="translate(112, 198)">
    <rect x="-4" y="-2" width="36" height="24" fill="#000000" rx="4" />
    <text x="14" y="16" font-family="Arial, Impact, sans-serif" font-weight="900" font-size="18" fill="#fde047" text-anchor="middle">M</text>
  </g>
</svg>
